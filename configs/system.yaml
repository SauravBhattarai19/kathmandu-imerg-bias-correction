# =============================================================================
# system.yaml  –  Computational resource configuration
#
# Adjust for local laptop vs HPC cluster.
# =============================================================================

# Google Earth Engine
gee:
  project: ee-sauravbhattarai1999
  api_delay_s: 2.0             # seconds to sleep between consecutive GEE calls

# GSSHA execution
gssha:
  executable:     gssha81
  threads_per_run: 4           # OpenMP threads per simulation
  parallel_runs:  8            # simultaneous simulations
  # HPC example: 192 cores / 4 threads = 48 parallel runs
  # Laptop example: 8 cores  / 4 threads =  2 parallel runs
  omp_stack_size: 512M

# Bias correction algorithm
bias_correction:
  delta:          0.10         # ±10 % rainfall perturbation for elasticity
  lambda_smooth:  0.30         # spatial smoothness weight
  tau_prior:      0.20         # prior constraint weight
  max_iterations: 5
  convergence_threshold: 0.05  # stop when mean error < 5 %

# Stage → discharge
preprocessing:
  sentinel_value: -9999990     # DHM no-data flag
  max_discharge:  10000        # m³/s – values above treated as errors

# Flood event detection
flood_identification:
  n_events:                25
  event_window_days:        3   # half-window around the peak
  min_peak_spacing_days:   10   # minimum separation between distinct events
  min_discharge:            0   # m³/s minimum threshold
