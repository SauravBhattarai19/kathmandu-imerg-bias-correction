# System configuration
# AMD Threadripper PRO 7995WX — 192 logical cores
#
# Parallelism: 4 parallel runs × 48 threads/run = 192 cores
# Change ONLY these two values to retune core usage.
# Both watershed and station modes read from here.

gssha:
  executable:      gssha81
  threads_per_run: 48           # OpenMP threads per GSSHA simulation
  parallel_runs:   4            # simultaneous GSSHA processes
  omp_stack_size:  512M

watershed_correction:
  max_iterations:         5
  convergence_threshold:  0.02
  alpha_bounds:           [0.2, 5.0]
  min_elasticity:         0.10
  trim_fraction:          0.25   # discard top/bottom 25% of per-event log-alphas
                                 # (robust aggregation for bimodal event populations)
  # parallel_runs and threads_per_run come from gssha: section above

bias_correction:
  delta:          0.10
  lambda_smooth:  1.0
  tau_prior:      1.0
